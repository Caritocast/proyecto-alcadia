<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - MóvilChía</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
    <style>
        :root {
            --verde: #1a5c3a;
            --verde-claro: #2d7a50;
            --dorado: #c8a84b;
            --crema: #f5f0e8;
            --texto: #1a1a1a;
            --gris: #5a5a5a;
            --blanco: #ffffff;
            --radio: 16px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--crema);
            color: var(--texto);
            line-height: 1.6;
        }

        .navbar {
            background: var(--verde);
            color: var(--blanco);
            padding: 20px 48px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 24px rgba(0,0,0,0.1);
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 22px;
            font-weight: 900;
            color: var(--blanco);
            text-decoration: none;
        }

        .logo span { color: var(--dorado); }

        .logo:hover {
            opacity: 0.9;
        }

        .user-info {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .user-info button {
            background: var(--dorado);
            color: var(--text);
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
        }

        .user-info button:hover {
            background: #d4b957;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 48px;
        }

        h1 { margin-bottom: 32px; }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 24px;
            margin-bottom: 48px;
        }

        .card {
            background: var(--blanco);
            border-radius: var(--radio);
            padding: 24px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
            border: 1px solid rgba(0,0,0,0.06);
            transition: all 0.2s;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 40px rgba(0,0,0,0.12);
        }

        .card h2 { font-size: 18px; margin-bottom: 12px; color: var(--verde); }

        .card p { font-size: 14px; color: var(--gris); margin-bottom: 16px; }

        .card-btn {
            background: var(--verde);
            color: var(--blanco);
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
        }

        .card-btn:hover {
            background: var(--verde-claro);
        }

        .loading {
            text-align: center;
            padding: 48px;
        }

        .spinner {
            border: 3px solid var(--crema);
            border-top-color: var(--verde);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 0.8s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .navbar { padding: 16px 24px; }
            .container { padding: 24px; }
            .card-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="navbar">
        <a class="logo" href="/" aria-label="Ir al inicio">Móvil<span>Chía</span></a>
        <div class="user-info">
            <span>
                Bienvenido, <strong class="user-name">Usuario</strong>
            </span>
            <button onclick="logout()">Cerrar Sesión</button>
        </div>
    </div>

    <div class="container">
        <h1>Panel de Control</h1>

        <div id="content">
            <div class="loading">
                <div class="spinner"></div>
                <p>Cargando...</p>
            </div>
        </div>
    </div>

    <script src="/js/dashboard.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Reporte - MóvilChía</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --verde: #1a5c3a;
            --verde-claro: #2d7a50;
            --dorado: #c8a84b;
            --crema: #f5f0e8;
            --crema-oscuro: #ede6d6;
            --tierra: #6b4f2a;
            --texto: #1a1a1a;
            --gris: #5a5a5a;
            --blanco: #ffffff;
            --rojo: #b91c1c;
            --radio: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--crema);
            color: var(--texto);
        }

        .navbar {
            background: var(--verde);
            color: var(--blanco);
            padding: 20px 48px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.1);
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 22px;
            font-weight: 900;
        }

        .logo span {
            color: var(--dorado);
        }

        .container {
            max-width: 600px;
            margin: 40px auto;
            padding: 48px;
            background: var(--blanco);
            border-radius: var(--radio);
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-bottom: 32px;
            color: var(--verde);
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--texto);
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--crema-oscuro);
            border-radius: 10px;
            font-family: 'DM Sans', sans-serif;
            font-size: 14px;
            color: var(--texto);
            background: var(--crema);
            transition: all 0.2s;
        }

        .form-group textarea {
            min-height: 150px;
            resize: vertical;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            background: var(--blanco);
            border-color: var(--verde);
            box-shadow: 0 0 0 3px rgba(26, 92, 58, 0.1);
        }

        .submit-btn {
            width: 100%;
            padding: 14px 20px;
            background: var(--verde);
            color: var(--blanco);
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .submit-btn:hover:not(:disabled) {
            background: var(--verde-claro);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(26, 92, 58, 0.3);
        }

        .submit-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .logout-btn {
            background: var(--dorado);
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'DM Sans', sans-serif;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
        }

        .logout-btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        .error {
            color: var(--rojo);
            font-size: 12px;
            margin-top: 4px;
        }

        .info-alert {
            background: #fef3c7;
            border: 1px solid #fcd34d;
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 24px;
            color: #92400e;
            font-size: 14px;
        }

        .success-message {
            display: none;
            margin-top: 24px;
        }

        .error-message {
            display: none;
            background: #fee2e2;
            border-color: #fca5a5;
            color: var(--rojo);
            margin-top: 24px;
        }

        @media (max-width: 600px) {
            .navbar {
                padding: 16px 24px;
            }

            .container {
                margin: 20px 16px;
                padding: 24px;
            }
        }
    </style>
</head>

<body>
    <div class="navbar">
        <div class="logo">Móvil<span>Chía</span></div>
        <button type="button" onclick="logout()" class="logout-btn">
            Cerrar Sesión
        </button>
    </div>

    <div class="container">
        <h1>📝 Crear Nuevo Reporte</h1>

        <div class="info-alert">
            ⓘ Tu reporte ayuda a la comunidad de Chía a identificar problemas de movilidad.
            Sé específico y detallado para que sea más útil.
        </div>

        <form id="reporteForm">
            <div class="form-group">
                <label for="titulo">Título del Reporte *</label>
                <input type="text" id="titulo" name="titulo" placeholder="Ej: Congestión Autopista Norte a las 8am"
                    required>
                <div class="error" id="tituloError"></div>
            </div>

            <div class="form-group">
                <label for="descripcion">Descripción *</label>
                <textarea id="descripcion" name="descripcion"
                    placeholder="Describe el problema en detalle. ¿Cuándo ocurre? ¿Quién se ve afectado? ¿Por qué es importante?"
                    required></textarea>
                <div class="error" id="descripcionError"></div>
            </div>

            <div class="form-group">
                <label for="tipo">Tipo de Problema *</label>
                <select id="tipo" name="tipo" required>
                    <option value="">-- Selecciona un tipo --</option>
                    <option value="congestión">🚗 Congestión vial</option>
                    <option value="infraestructura">🛣️ Infraestructura vial</option>
                    <option value="transporte_público">🚌 Transporte público</option>
                    <option value="ciclovía">🚲 Ciclovía / datos ciclista</option>
                    <option value="seguridad_vial">⚠️ Seguridad vial</option>
                    <option value="ambiental">🌱 Impacto ambiental</option>
                    <option value="conexión_bogotá">🔗 Conexión con Bogotá</option>
                    <option value="otro">📌 Otro</option>
                </select>
                <div class="error" id="tipoError"></div>
            </div>

            <div class="form-group">
                <label for="severidad">Severidad del Problema *</label>
                <select id="severidad" name="severidad" required>
                    <option value="">-- Selecciona severidad --</option>
                    <option value="baja">🟢 Baja</option>
                    <option value="media">🟡 Media</option>
                    <option value="alta">🔴 Alta</option>
                    <option value="crítica">🔴🔴 Crítica</option>
                </select>
                <div class="error" id="severidadError"></div>
            </div>

            <div class="form-group">
                <label for="ubicacion">Ubicación (opcional)</label>
                <input type="text" id="ubicacion" name="ubicacion" placeholder="Ej: Autopista Norte, Calle 193, Chía">
                <div class="error" id="ubicacionError"></div>
            </div>

            <button type="submit" class="submit-btn">Enviar Reporte</button>
            <div id="successMessage" class="info-alert success-message">
                ✅ Reporte enviado exitosamente. Redirigiendo...
            </div>
            <div id="errorMessage" class="info-alert error-message">
            </div>
        </form>
    </div>

    <script>
        // Verificar autenticación
        const token = localStorage.getItem('token');
        const user = JSON.parse(localStorage.getItem('user') || 'null');

        if (!token || !user) {
            window.location.href = '/views/login.html';
        }

        // Manejar envío del formulario
        document.getElementById('reporteForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const titulo = document.getElementById('titulo').value.trim();
            const descripcion = document.getElementById('descripcion').value.trim();
            const tipo = document.getElementById('tipo').value;
            const severidad = document.getElementById('severidad').value;
            const ubicacion = document.getElementById('ubicacion').value.trim();

            // Validaciones
            let isValid = true;

            if (titulo.length < 5) {
                document.getElementById('tituloError').textContent = 'Mínimo 5 caracteres';
                isValid = false;
            } else {
                document.getElementById('tituloError').textContent = '';
            }

            if (descripcion.length < 20) {
                document.getElementById('descripcionError').textContent = 'Mínimo 20 caracteres';
                isValid = false;
            } else {
                document.getElementById('descripcionError').textContent = '';
            }

            if (!tipo) {
                document.getElementById('tipoError').textContent = 'Debes seleccionar un tipo';
                isValid = false;
            } else {
                document.getElementById('tipoError').textContent = '';
            }

            if (!severidad) {
                document.getElementById('severidadError').textContent = 'Debes seleccionar severidad';
                isValid = false;
            } else {
                document.getElementById('severidadError').textContent = '';
            }

            if (!isValid) return;

            // Enviar
            const btn = e.target.querySelector('button[type="submit"]');
            btn.disabled = true;
            btn.textContent = 'Enviando...';

            try {
                const response = await fetch('http://localhost:3000/api/reportes', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        titulo,
                        descripcion,
                        tipo,
                        severidad,
                        ubicacion
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Error al crear reporte');
                }

                document.getElementById('successMessage').style.display = 'block';
                document.getElementById('errorMessage').style.display = 'none';

                setTimeout(() => {
                    window.location.href = '/public/dashboard.html';
                }, 2000);

            } catch (error) {
                document.getElementById('errorMessage').style.display = 'block';
                document.getElementById('errorMessage').textContent = '❌ ' + error.message;
                btn.disabled = false;
                btn.textContent = 'Enviar Reporte';
            }
        });

        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = '/views/login';
        }
    </script>
</body>

</html>
